<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="A message goes to four drafting slots, two on each model; two checking slots look at the drafts; a decision model picks which answer stands; one slot writes the reply">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071513"/><stop offset="1" stop-color="#040b0b"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5fae96"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .t { fill: #e9eef5; font-size: 15px; font-weight: 600; }
      .s { fill: #9fb3b0; font-size: 12px; }
      .h { fill: #6ee7b7; font-size: 11px; font-weight: 700; letter-spacing: 2.4px; }
      .lfm { fill: rgba(110,231,183,.10); stroke: #6ee7b7; }
      .bon { fill: rgba(125,170,255,.10); stroke: #8fb4ff; }
      .kev { fill: rgba(217,168,255,.10); stroke: #d9a8ff; }
      .io { fill: rgba(255,255,255,.04); stroke: #9fb3b0; }
      .w { stroke: #5fae96; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="920" height="400" rx="26" fill="url(#bg)" stroke="rgba(110,231,183,.22)"/>
  <text class="h" x="170" y="42">DRAFT</text><text class="h" x="438" y="42">CHECK</text><text class="h" x="586" y="42">DECIDE</text><text class="h" x="750" y="42">WRITE</text>

  <rect class="io" x="24" y="172" width="104" height="56" rx="12"/><text class="t" x="76" y="198" text-anchor="middle">Message</text><text class="s" x="76" y="215" text-anchor="middle">in</text>

  <g stroke-width="1.4">
    <rect class="lfm" x="170" y="62" width="190" height="56" rx="12"/><rect class="lfm" x="170" y="136" width="190" height="56" rx="12"/>
    <rect class="bon" x="170" y="210" width="190" height="56" rx="12"/><rect class="bon" x="170" y="284" width="190" height="56" rx="12"/>
    <rect class="lfm" x="418" y="118" width="140" height="64" rx="12"/><rect class="bon" x="418" y="218" width="140" height="64" rx="12"/>
    <rect class="kev" x="578" y="168" width="140" height="64" rx="12"/>
    <rect class="lfm" x="736" y="168" width="118" height="64" rx="12"/>
  </g>
  <text class="t" x="186" y="88">Answer it plainly</text><text class="s" x="186" y="105">Model 1 · slot 1</text>
  <text class="t" x="186" y="162">Work it in steps</text><text class="s" x="186" y="179">Model 1 · slot 2</text>
  <text class="t" x="186" y="236">Test the first answer</text><text class="s" x="186" y="253">Model 2 · slot 1</text>
  <text class="t" x="186" y="310">Go another way</text><text class="s" x="186" y="327">Model 2 · slot 2</text>
  <text class="t" x="432" y="146">Find the slip</text><text class="s" x="432" y="164">Model 1 · slot 3</text>
  <text class="t" x="432" y="246">Put it back in</text><text class="s" x="432" y="264">Model 2 · slot 3</text>
  <text class="t" x="590" y="196">Which stands</text><text class="s" x="590" y="214">Kev, a decision model</text>
  <text class="t" x="750" y="196">The reply</text><text class="s" x="750" y="214">Model 1 · slot 4</text>

  <path class="w" d="M128 190 C150 190 148 90 168 90"/><path class="w" d="M128 196 C150 196 150 164 168 164"/>
  <path class="w" d="M128 204 C150 204 150 238 168 238"/><path class="w" d="M128 210 C150 210 148 312 168 312"/>
  <path class="w" d="M360 90 C392 90 388 140 416 142"/><path class="w" d="M360 164 C388 164 392 152 416 152"/>
  <path class="w" d="M360 238 C388 238 392 248 416 248"/><path class="w" d="M360 312 C392 312 388 262 416 258"/>
  <path class="w" d="M360 96 C400 100 384 236 416 240" opacity=".45"/><path class="w" d="M360 170 C396 174 388 240 416 244" opacity=".45"/><path class="w" d="M360 232 C396 228 388 162 416 158" opacity=".45"/><path class="w" d="M360 306 C400 302 384 168 416 164" opacity=".45"/><path class="w" d="M558 150 C574 150 562 190 576 192"/><path class="w" d="M558 250 C574 250 562 210 576 208"/>
  <path class="w" d="M718 200 L734 200"/><path class="w" d="M854 200 L868 200"/>
  <text class="t" x="892" y="196" text-anchor="middle">Reply</text><text class="s" x="892" y="213" text-anchor="middle">out</text>

  <rect class="lfm" x="170" y="366" width="14" height="14" rx="4" stroke-width="1.4"/><text class="s" x="192" y="378">Small model 1</text>
  <rect class="bon" x="290" y="366" width="14" height="14" rx="4" stroke-width="1.4"/><text class="s" x="312" y="378">Small model 2</text>
  <rect class="kev" x="410" y="366" width="14" height="14" rx="4" stroke-width="1.4"/><text class="s" x="432" y="378">Kev</text>
  <text class="s" x="490" y="378">If every draft agrees, the checks and Kev are passed over.</text>
</svg>
